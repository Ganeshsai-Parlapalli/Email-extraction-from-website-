<!DOCTYPE html>
<html>
<head>
    <title>Email Extractor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f3f4f6;
        }

        /* HEADER */
        .header {
            background: #111827;
            color: white;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 600;
        }

        /* MAIN CONTAINER */
        .container {
            padding: 30px;
        }

        /* STATS BAR */
        .stats {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .stats-number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
        }

        button {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-right: 10px;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .success-btn {
            background: #10b981;
            color: white;
        }

        .success-btn:hover {
            background: #059669;
        }

        .csv-btn {
            background: #f59e0b;
            color: white;
        }

        .csv-btn:hover {
            background: #d97706;
        }

        .button-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: #2563eb;
            font-weight: 600;
        }

        .spinner {
            margin-top: 10px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            margin-top: 15px;
            font-weight: 600;
        }

    </style>
</head>

<body>

<div class="header">
    📧 Email Extractor from Website
</div>

<div class="container">

    <!-- Stats Bar -->
    <div class="stats">
        Emails Found
        <div class="stats-number" id="totalCount">0</div>
    </div>

    <!-- Extraction Card -->
    <div class="card">
        <h2>Start Email Extraction</h2>

        <input type="text" id="url" placeholder="Enter website URL (https://example.com)">

        <div class="button-group">
            <button class="primary-btn" id="startBtn" onclick="startExtraction()">
                Start Extraction
            </button>

            <a href="/download/excel">
                <button class="success-btn">Download Excel</button>
            </a>

            <a href="/download/csv">
                <button class="csv-btn">Download CSV</button>
            </a>
        </div>

        <div class="loading" id="loading">
            Processing website...
            <div class="spinner"></div>
        </div>

        <div class="result" id="result"></div>
    </div>

</div>

<script>
function startExtraction(){

    let url = document.getElementById("url").value;
    let loading = document.getElementById("loading");
    let result = document.getElementById("result");
    let button = document.getElementById("startBtn");
    let totalDisplay = document.getElementById("totalCount");

    if(!url){
        alert("Please enter URL");
        return;
    }

    loading.style.display = "block";
    result.innerText = "";
    button.disabled = true;

    fetch("/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({url: url})
    })
    .then(res => res.json())
    .then(data => {

        loading.style.display = "none";
        button.disabled = false;

        result.innerText = data.message;

        if(data.total !== undefined){
            totalDisplay.innerText = data.total;
        }

    })
    .catch(error => {

        loading.style.display = "none";
        button.disabled = false;

        result.innerText = "Error occurred!";
        console.log(error);
    });
}
</script>

</body>
</html>
